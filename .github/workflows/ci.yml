name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app --select E9,F63,F7,F82 --ignore E501
      - name: Compile check
        working-directory: backend
        run: python -m compileall -q app
      - name: Tests
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: pharmacy_ai_os_test
          JWT_SECRET: ci-test-secret-not-for-production
          SEED_DEMO: "0"
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Build
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pharmaos-api ./backend
      - name: Build frontend image
        run: docker build -t pharmaos-web ./frontend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency audit (backend)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-0000-0000 || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependency audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=critical || true
      - name: Secret scan (naive)
        run: |
          ! grep -rIn --exclude-dir=.venv --exclude-dir=node_modules \
            -E "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})" . || \
          (echo "::warning::potential secret found" && exit 1)
